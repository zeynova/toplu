```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taş Kağıt Makas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 70px;
        }

        .oyun {
            background-color: white;
            width: 380px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 12px #aaa;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 12px 18px;
            margin: 8px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
        }

        button:hover {
            background-color: #217dbb;
        }

        #sonuc {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="oyun">
        <h1>✊ Taş - Kağıt - Makas ✌️</h1>
        <p>Bir seçim yapınız:</p>

        <button onclick="oyna('Taş')">✊ Taş</button>
        <button onclick="oyna('Kağıt')">📄 Kağıt</button>
        <button onclick="oyna('Makas')">✌️ Makas</button>

        <p id="secimler"></p>
        <p id="sonuc"></p>
    </div>

    <script>
        function oyna(kullaniciSecimi) {
            const secenekler = ["Taş", "Kağıt", "Makas"];
            const bilgisayarSecimi =
                secenekler[Math.floor(Math.random() * 3)];

            let sonuc = "";

            if (kullaniciSecimi === bilgisayarSecimi) {
                sonuc = "Berabere!";
            }
            else if (
                (kullaniciSecimi === "Taş" && bilgisayarSecimi === "Makas") ||
                (kullaniciSecimi === "Kağıt" && bilgisayarSecimi === "Taş") ||
                (kullaniciSecimi === "Makas" && bilgisayarSecimi === "Kağıt")
            ) {
                sonuc = "🎉 Kazandınız!";
            }
            else {
                sonuc = "😔 Bilgisayar kazandı!";
            }

            document.getElementById("secimler").innerHTML =
                "Sizin seçiminiz: " + kullaniciSecimi +
                "<br>Bilgisayarın seçimi: " + bilgisayarSecimi;

            document.getElementById("sonuc").innerHTML = sonuc;
        }
    </script>

</body>
</html>
```
